{% extends 'base.html' %}
{% set active = 'repairs' %}
{% block title %}Edit {{ job.job_number }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h2 class="page-title">Edit {{ job.job_number }}</h2>
    <p class="page-sub">{{ job.device_make }} {{ job.device_model }}</p>
  </div>
  <a href="{{ url_for('repairs.view', job_id=job.id) }}" class="btn btn-ghost">
    <i class="bi bi-arrow-left"></i> Back to Job
  </a>
</div>

<form method="POST">
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card-section mb-4">
        <h6 class="fw-bold mb-3">Device Details</h6>
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Make <span class="text-danger">*</span></label>
            <input type="text" name="device_make" list="make-list"
                   class="form-control form-control-sm" required
                   value="{{ job.device_make }}">
            <datalist id="make-list">
              <option value="Apple"><option value="Samsung"><option value="Lenovo">
              <option value="HP"><option value="Dell"><option value="ASUS">
              <option value="JBL"><option value="Anker"><option value="Sony">
            </datalist>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">Model <span class="text-danger">*</span></label>
            <input type="text" name="device_model" class="form-control form-control-sm" required
                   value="{{ job.device_model }}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold small">IMEI / Serial</label>
            <input type="text" name="imei" class="form-control form-control-sm"
                   value="{{ job.imei or '' }}" style="font-family:monospace">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold small">Color</label>
            <input type="text" name="color" class="form-control form-control-sm"
                   value="{{ job.color or '' }}">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold small">Technician</label>
            <input type="text" name="technician" class="form-control form-control-sm"
                   value="{{ job.technician or '' }}">
          </div>
        </div>
      </div>

      <div class="card-section mb-4">
        <h6 class="fw-bold mb-3">Problem & Diagnosis</h6>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Problem <span class="text-danger">*</span></label>
          <textarea name="problem" class="form-control form-control-sm" rows="3" required>{{ job.problem }}</textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Diagnosis</label>
          <textarea name="diagnosis" class="form-control form-control-sm" rows="3">{{ job.diagnosis or '' }}</textarea>
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="card-section mb-4">
        <h6 class="fw-bold mb-3">Cost & Schedule</h6>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Estimated Cost (TZS)</label>
          <input type="number" name="estimated_cost" class="form-control form-control-sm"
                 step="500" value="{{ job.estimated_cost or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Final Cost (TZS)</label>
          <input type="number" name="final_cost" class="form-control form-control-sm"
                 step="500" value="{{ job.final_cost or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Estimated Ready</label>
          <input type="date" name="estimated_ready" class="form-control form-control-sm"
                 value="{{ job.estimated_ready or '' }}">
        </div>
      </div>
      <div class="card-section mb-4">
        <h6 class="fw-bold mb-3">Notes</h6>
        <textarea name="notes" class="form-control form-control-sm" rows="3">{{ job.notes or '' }}</textarea>
      </div>
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('repairs.view', job_id=job.id) }}" class="btn btn-ghost">Cancel</a>
      </div>
    </div>
  </div>
</form>
{% endblock %}
