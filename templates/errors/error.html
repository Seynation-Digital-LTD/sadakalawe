<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} | Sadakalawe Enterprises</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --orange: #F26522; }
    body {
      background: #f8f8f8;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .err-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,.10);
      padding: 48px 40px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .err-logo {
      height: 52px;
      margin-bottom: 24px;
    }
    .err-code {
      font-size: 72px;
      font-weight: 800;
      color: var(--orange);
      line-height: 1;
      margin-bottom: 8px;
    }
    .err-title {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 10px;
    }
    .err-msg {
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .err-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-home {
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .btn-home:hover { background: #d4551a; color: #fff; }
    .btn-back {
      background: #f3f4f6;
      color: #374151;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }
    .btn-back:hover { background: #e5e7eb; }
    .err-detail {
      margin-top: 28px;
      background: #fef3ea;
      border: 1px solid #fcd9b6;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12.5px;
      color: #92400e;
      text-align: left;
      word-break: break-all;
    }
    .err-divider {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin: 28px 0 20px;
    }
    .err-brand {
      font-size: 11px;
      color: #d1d5db;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <div class="err-card">
    <img src="/static/logo.png" alt="Sadakalawe" class="err-logo"
         onerror="this.style.display='none'">
    <div class="err-code">{{ code }}</div>
    <div class="err-title">{{ title }}</div>
    <p class="err-msg">{{ message }}</p>
    <div class="err-actions">
      <a href="/" class="btn-home">
        <i class="bi bi-house-fill"></i> Go to Dashboard
      </a>
      <button onclick="history.back()" class="btn-back">
        <i class="bi bi-arrow-left"></i> Go Back
      </button>
    </div>
    {% if detail %}
    <div class="err-detail">
      <strong>Details:</strong> {{ detail }}
    </div>
    {% endif %}
    <hr class="err-divider">
    <div class="err-brand">SADAKALAWE ENTERPRISES &nbsp;·&nbsp; Sales Management System</div>
  </div>
</body>
</html>
