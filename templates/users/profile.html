{% extends 'base.html' %}
{% block title %}Profile{% endblock %}

{% block content %}
<div class="page-header">
  <h2 class="page-title">My Profile</h2>
</div>

<div style="max-width:520px">

  <!-- Edit profile details -->
  <div class="card-section mb-3">
    <h5 class="fw-semibold mb-3">Profile Details</h5>
    <form method="POST">
      <input type="hidden" name="action" value="details">
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name</label>
        <input type="text" name="full_name" class="form-control"
               value="{{ current_user.full_name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" name="username" class="form-control"
               value="{{ current_user.username }}" required autocomplete="off">
      </div>
      <div class="mb-1 text-muted" style="font-size:12px">
        Role: <strong>{{ current_user.role | capitalize }}</strong>
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>

  <!-- Change password -->
  <div class="card-section">
    <h5 class="fw-semibold mb-3">Change Password</h5>
    <form method="POST">
      <input type="hidden" name="action" value="password">
      <div class="mb-3">
        <label class="form-label fw-semibold">Current Password</label>
        <input type="password" name="current_password" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">New Password</label>
        <input type="password" name="new_password" class="form-control" required minlength="6">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary">Change Password</button>
    </form>
  </div>

</div>
{% endblock %}
